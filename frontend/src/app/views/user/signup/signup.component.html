<div class="container">
  <div class="auth">
    <div class="auth-form">
      <h1 class="auth-title">Регистрация на сайте</h1>
      <form [formGroup]="_signupForm" class="auth-fields">
        <div class="auth-field">
          <input type="text" class="input" formControlName="name" placeholder="Ваше имя">
          <div class="auth-error"
               *ngIf="_signupForm.get('name')?.invalid && _signupForm.get('name')?.touched">
            Имя должно состоять из русских букв и начинаться с заглавной
          </div>
        </div>
        <div class="auth-field">
          <input type="text" class="input" formControlName="email" placeholder="Электронная почта">
          <div class="auth-error error"
               *ngIf="_signupForm.get('email')?.invalid && _signupForm.get('email')?.touched">
            Введите корректный email
          </div>
        </div>
        <div class="auth-field auth-field-password">
          <input [type]="_showPassword ? 'text' : 'password'" class="input" formControlName="password"
                 placeholder="Пароль">
          <img class="auth-eye"
               [src]="_showPassword ? '/assets/images/icons/eye-off.svg' : '/assets/images/icons/eye.svg'"
               alt="Показать пароль"
               (click)="_showPassword = !_showPassword">
          <div class="auth-error error"
               *ngIf="_signupForm.get('password')?.invalid && _signupForm.get('password')?.touched">
            Не менее 8 символов, минимум одна заглавная буква и одна цифра
          </div>
        </div>
        <div class="auth-checkbox checkbox">
          <input type="checkbox" id="agree" formControlName="agree">
          <label for="agree">
            Я принимаю <a routerLink="/policy" fragment="agreement" target="_blank">условия пользовательского
            соглашения</a> и даю <a routerLink="/policy" fragment="personal" target="_blank">согласие на обработку
            персональных данных</a>.
          </label>
        </div>
        <button type="button" class="button auth-button"
                [disabled]="!_signupForm.valid"
                (click)="_signup()">Зарегистрироваться
        </button>
      </form>
      <div class="auth-bottom">
        Уже есть аккаунт? <a routerLink="/login">Войдите</a>
      </div>
    </div>
    <div class="auth-image">
      <img src="/assets/images/page/signup.webp" alt="Регистрация">
    </div>
  </div>
</div>
