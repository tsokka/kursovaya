<div class="container">
  <div class="auth">
    <div class="auth-form">
      <h1 class="auth-title">Войти в личный кабинет</h1>
      <form [formGroup]="_loginForm" class="auth-fields">
        <div class="auth-field">
          <input type="text" class="input" formControlName="email" placeholder="Электронная почта">
          <div class="auth-error error"
               *ngIf="_loginForm.get('email')?.invalid && _loginForm.get('email')?.touched">
            Введите корректный email
          </div>
        </div>
        <div class="auth-field auth-field-password">
          <input [type]="_showPassword ? 'text' : 'password'" class="input" formControlName="password"
                 placeholder="Пароль">
          <img class="auth-eye"
               [src]="_showPassword ? '/assets/images/icons/eye-off.svg' : '/assets/images/icons/eye.svg'"
               alt="Показать пароль"
               (click)="_showPassword = !_showPassword">
          <div class="auth-error error"
               *ngIf="_loginForm.get('password')?.invalid && _loginForm.get('password')?.touched">
            Введите пароль
          </div>
        </div>
        <div class="auth-checkbox checkbox">
          <input type="checkbox" id="rememberMe" formControlName="rememberMe">
          <label for="rememberMe">Запомнить меня</label>
        </div>
        <button type="button" class="button auth-button"
                [disabled]="!_loginForm.valid"
                (click)="_login()">Войти
        </button>
      </form>
      <div class="auth-bottom">
        Нет аккаунта? <a routerLink="/signup">Пройдите регистрацию</a>
      </div>
    </div>
    <div class="auth-image">
      <img src="/assets/images/page/login.webp" alt="Вход">
    </div>
  </div>
</div>
